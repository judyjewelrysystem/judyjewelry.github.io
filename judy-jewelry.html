<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUDY珠寶 Inventory System</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:linear-gradient(135deg,#f8e8ea 0%,#f5d0d8 30%,#f0c8d4 60%,#edd4c8 100%);min-height:100vh;color:#3d1a22}
  :root{
    --rose-gold:#c9856a;--rose-dark:#8b3a4a;--rose-light:#f5d0d8;
    --glass-bg:rgba(255,255,255,0.45);--glass-border:rgba(255,255,255,0.6);
    --sidebar-w:260px;--header-h:64px;
  }
  /* Scrollbar */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,0.2)}
  ::-webkit-scrollbar-thumb{background:var(--rose-gold);border-radius:3px}

  /* Layout */
  .app-layout{display:flex;min-height:100vh}
  .sidebar{
    width:var(--sidebar-w);min-height:100vh;position:fixed;left:0;top:0;z-index:100;
    background:rgba(255,255,255,0.45);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border-right:1px solid var(--glass-border);
    display:flex;flex-direction:column;
    transition:transform 0.3s;
  }
  @supports not (backdrop-filter:blur(1px)){
    .sidebar{background:rgba(245,208,216,0.95)}
  }
  .main-content{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
  .topbar{
    height:var(--header-h);background:rgba(255,255,255,0.5);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--glass-border);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;position:sticky;top:0;z-index:50;
  }
  .page-body{padding:24px;flex:1;overflow-y:auto}

  /* Logo */
  .logo-area{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,0.4)}
  .logo-title{font-size:15px;font-weight:900;color:var(--rose-dark);line-height:1.3;letter-spacing:0.5px}
  .logo-sub{font-size:11px;color:var(--rose-gold);font-weight:700;letter-spacing:1px;margin-top:2px}
  .diamond-icon{font-size:28px;filter:drop-shadow(0 2px 4px rgba(201,133,106,0.5));display:inline-block}

  /* Nav */
  .nav-section{padding:12px 8px;flex:1;overflow-y:auto}
  .nav-group-label{font-size:10px;font-weight:800;color:var(--rose-gold);letter-spacing:2px;padding:8px 12px 4px;text-transform:uppercase}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;
    cursor:pointer;margin-bottom:2px;transition:all 0.2s;
    color:#7a3a48;font-weight:700;font-size:15px;
    border:none;background:none;width:100%;text-align:left;
  }
  .nav-item:hover{background:rgba(255,255,255,0.5);color:var(--rose-dark)}
  .nav-item.active{
    background:rgba(255,255,255,0.75);color:var(--rose-dark);
    border-left:3px solid var(--rose-gold);padding-left:11px;
    box-shadow:0 2px 8px rgba(201,133,106,0.2);
  }
  .nav-icon{font-size:18px;width:22px;text-align:center}

  /* User area */
  .user-area{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.4);font-size:13px}
  .user-name{font-weight:800;color:var(--rose-dark);font-size:14px}
  .user-role{color:var(--rose-gold);font-size:11px;font-weight:700}
  .logout-btn{
    margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid rgba(201,133,106,0.4);
    background:rgba(255,255,255,0.4);color:var(--rose-dark);font-weight:700;font-size:13px;
    cursor:pointer;transition:all 0.2s;
  }
  .logout-btn:hover{background:rgba(201,133,106,0.2)}

  /* Cards */
  .card{background:rgba(255,255,255,0.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;border:1px solid var(--glass-border);padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(139,58,74,0.08)}
  @supports not (backdrop-filter:blur(1px)){.card{background:rgba(250,240,242,0.95)}}
  .card-title{font-size:17px;font-weight:900;color:var(--rose-dark);margin-bottom:16px;display:flex;align-items:center;gap:8px}

  /* Stat cards */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .stat-card{
    background:rgba(255,255,255,0.65);border-radius:14px;padding:16px;
    border:1px solid var(--glass-border);text-align:center;
    box-shadow:0 2px 12px rgba(139,58,74,0.08);transition:transform 0.2s;
  }
  .stat-card:hover{transform:translateY(-2px)}
  .stat-label{font-size:12px;font-weight:800;color:var(--rose-gold);margin-bottom:6px;letter-spacing:0.5px}
  .stat-value{font-size:22px;font-weight:900;color:var(--rose-dark);line-height:1.2}
  .stat-sub{font-size:11px;color:#a06070;margin-top:3px;font-weight:600}

  /* Buttons */
  .btn{padding:9px 18px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;transition:all 0.2s;border:none;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:linear-gradient(135deg,#c9856a,#8b3a4a);color:#fff;box-shadow:0 3px 12px rgba(139,58,74,0.3)}
  .btn-primary:hover{box-shadow:0 5px 18px rgba(139,58,74,0.4);transform:translateY(-1px)}
  .btn-secondary{background:rgba(255,255,255,0.6);color:var(--rose-dark);border:1px solid rgba(201,133,106,0.4)}
  .btn-secondary:hover{background:rgba(255,255,255,0.85)}
  .btn-danger{background:linear-gradient(135deg,#e05a6a,#c0392b);color:#fff}
  .btn-danger:hover{box-shadow:0 5px 16px rgba(192,57,43,0.35)}
  .btn-sm{padding:6px 12px;font-size:12px}
  .btn-warn{background:linear-gradient(135deg,#e0a030,#c07820);color:#fff}

  /* Forms */
  .form-group{margin-bottom:14px}
  .form-label{display:block;font-size:14px;font-weight:800;color:var(--rose-dark);margin-bottom:6px}
  .form-control{
    width:100%;padding:11px 14px;border-radius:9px;
    border:1.5px solid rgba(201,133,106,0.35);
    background:rgba(255,255,255,0.7);color:#3d1a22;
    font-size:15px;font-weight:600;font-family:inherit;
    transition:border 0.2s;outline:none;
  }
  .form-control:focus{border-color:var(--rose-gold);background:rgba(255,255,255,0.9)}
  select.form-control{cursor:pointer}
  textarea.form-control{resize:vertical;min-height:80px}

  /* Table */
  .table-wrap{overflow-x:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
  .table-wrap::after{content:'← 左右滑動查看更多 →';display:none;text-align:center;font-size:11px;color:#c9856a;font-weight:700;padding:4px}
  @media(max-width:768px){.table-wrap::after{display:block}}
  table{width:100%;border-collapse:collapse;font-size:14px;font-weight:600;min-width:560px}
  th{background:rgba(201,133,106,0.15);color:var(--rose-dark);padding:12px 13px;font-size:13px;font-weight:900;text-align:left;white-space:nowrap;border-bottom:2px solid rgba(201,133,106,0.2)}
  td{padding:11px 13px;border-bottom:1px solid rgba(201,133,106,0.1);vertical-align:middle;color:#4a2030;font-size:14px}
  tr:hover td{background:rgba(255,255,255,0.4)}

  /* Badge */
  .badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:0.3px}
  .badge-gold{background:linear-gradient(135deg,#f5c842,#e0a020);color:#5a3800}
  .badge-silver{background:linear-gradient(135deg,#d0d8e8,#a8b8cc);color:#2a3a5a}
  .badge-bronze{background:linear-gradient(135deg,#d4956a,#b87040);color:#4a2000}
  .badge-platinum{background:linear-gradient(135deg,#e8e8f5,#c0c0e0);color:#3a3a7a}
  .badge-diamond{background:linear-gradient(135deg,#b8e8f8,#80c8e8);color:#003a5a}
  .badge-active{background:rgba(80,180,80,0.2);color:#1a6a2a;border:1px solid rgba(80,180,80,0.3)}
  .badge-inactive{background:rgba(180,80,80,0.15);color:#7a1a2a;border:1px solid rgba(180,80,80,0.2)}
  .badge-repair{background:rgba(230,160,30,0.2);color:#6a4a00;border:1px solid rgba(230,160,30,0.3)}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(61,26,34,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .modal-box{background:rgba(255,245,246,0.97);border-radius:18px;padding:24px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(139,58,74,0.25);border:1px solid var(--glass-border)}
  .modal-title{font-size:18px;font-weight:900;color:var(--rose-dark);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
  .modal-close{cursor:pointer;font-size:22px;color:var(--rose-gold);background:none;border:none;font-weight:900}

  /* Login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8e8ea 0%,#f5d0d8 30%,#f0c8d4 60%,#edd4c8 100%)}
  .login-box{background:rgba(255,255,255,0.65);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:24px;padding:40px;width:100%;max-width:400px;border:1px solid var(--glass-border);box-shadow:0 20px 60px rgba(139,58,74,0.2)}
  @supports not (backdrop-filter:blur(1px)){.login-box{background:rgba(250,240,242,0.97)}}

  /* Image upload */
  .img-upload-area{border:2px dashed rgba(201,133,106,0.4);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(255,255,255,0.4)}
  .img-upload-area:hover{border-color:var(--rose-gold);background:rgba(255,255,255,0.6)}
  .img-thumb{width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid rgba(201,133,106,0.3)}

  /* Grid forms */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr}}

  /* Page title */
  .page-title{font-size:22px;font-weight:900;color:var(--rose-dark);margin-bottom:20px;display:flex;align-items:center;gap:10px}

  /* Search bar */
  .search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search-input{flex:1;min-width:180px}

  /* Tabs */
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:rgba(255,255,255,0.4);padding:4px;border-radius:12px;border:1px solid rgba(201,133,106,0.2)}
  .tab{flex:1;padding:9px;text-align:center;border-radius:9px;cursor:pointer;font-weight:800;font-size:13px;color:#8a5060;transition:all 0.2s;border:none;background:none}
  .tab.active{background:rgba(255,255,255,0.85);color:var(--rose-dark);box-shadow:0 2px 8px rgba(139,58,74,0.12)}

  /* Chart canvas */
  .chart-container{position:relative;height:220px}

  /* Mobile */
  .menu-toggle{display:none;background:none;border:none;font-size:28px;cursor:pointer;color:var(--rose-dark);padding:4px 8px;border-radius:8px;line-height:1}
  .menu-toggle:active{background:rgba(201,133,106,0.15)}

  @media(max-width:768px){
    :root{--header-h:60px}
    body{font-size:15px}

    /* Sidebar slides in */
    .sidebar{transform:translateX(-100%);width:280px}
    .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(139,58,74,0.2)}
    .main-content{margin-left:0}
    .menu-toggle{display:flex;align-items:center;justify-content:center}

    /* Topbar adjustments */
    .topbar{padding:0 14px;gap:8px}
    .topbar-title{font-size:14px !important}
    .topbar-date{display:none}

    /* Page body */
    .page-body{padding:14px}

    /* Stats: 2 columns on mobile */
    .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .stat-card{padding:12px 10px}
    .stat-value{font-size:18px !important}
    .stat-label{font-size:11px !important}

    /* Forms: 1 column on mobile */
    .form-grid{grid-template-columns:1fr}

    /* Tables: make scrollable with larger touch targets */
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{min-width:600px;font-size:13px}
    th{font-size:12px;padding:10px 10px;white-space:nowrap}
    td{padding:10px 10px;font-size:13px}

    /* Page title smaller on mobile */
    .page-title{font-size:18px !important;margin-bottom:14px}

    /* Tabs wrap on small screens */
    .tabs{flex-wrap:wrap;gap:6px}
    .tab{flex:none;width:calc(50% - 6px);padding:10px 6px;font-size:12px}

    /* Buttons bigger touch targets */
    .btn{padding:10px 16px;font-size:14px}
    .btn-sm{padding:8px 12px;font-size:13px;min-width:44px;min-height:36px}

    /* Modal full screen on mobile */
    .modal-overlay{padding:0;align-items:flex-end}
    .modal-box{border-radius:20px 20px 0 0;max-height:92vh;max-width:100%;width:100%}

    /* Form controls bigger */
    .form-control{font-size:16px !important;padding:12px 14px;min-height:48px}
    select.form-control{min-height:48px}
    .form-label{font-size:14px !important;margin-bottom:6px}

    /* Card padding smaller */
    .card{padding:14px}
    .card-title{font-size:15px !important}

    /* Charts shorter on mobile */
    .chart-container{height:180px}

    /* Nav item bigger touch targets */
    .nav-item{padding:13px 14px;font-size:15px;margin-bottom:4px}
    .nav-icon{font-size:20px}

    /* Search bar stack on mobile */
    .search-bar{flex-direction:column;gap:8px}
    .search-input{min-width:unset;width:100%}
    .search-bar select{width:100%}

    /* User area in sidebar */
    .user-area{padding:14px 16px}
    .user-name{font-size:16px}
    .user-role{font-size:13px;margin-top:2px}
    .logout-btn{padding:12px;font-size:15px;margin-top:10px}

    /* Alert */
    .alert{font-size:14px;padding:13px 16px}

    /* Login box */
    .login-box{margin:16px;padding:28px 20px;border-radius:20px}
  }

  /* Tablet (768px - 1024px) */
  @media(min-width:769px) and (max-width:1024px){
    :root{--sidebar-w:220px}
    .stats-grid{grid-template-columns:repeat(3,1fr)}
    .page-body{padding:18px}
    .nav-item{font-size:13px;padding:10px 12px}
    table{font-size:13px}
    th,td{padding:9px 10px}
  }

  /* Very small phones */
  @media(max-width:375px){
    .stats-grid{grid-template-columns:1fr 1fr}
    .stat-value{font-size:16px !important}
    .page-body{padding:10px}
    .topbar{padding:0 10px}
  }

  .mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99}
  .mobile-overlay.show{display:block}

  /* Alert */
  .alert{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-weight:700;font-size:14px}
  .alert-success{background:rgba(80,180,100,0.15);color:#1a6a30;border:1px solid rgba(80,180,100,0.3)}
  .alert-error{background:rgba(220,60,60,0.12);color:#8a1a1a;border:1px solid rgba(220,60,60,0.25)}

  /* Repair status */
  .status-chip{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800}
  .status-pending{background:rgba(230,160,30,0.2);color:#6a4a00}
  .status-inprogress{background:rgba(30,130,220,0.15);color:#0a3a7a}
  .status-done{background:rgba(60,180,80,0.15);color:#0a4a20}

  .flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.text-sm{font-size:13px}.text-xs{font-size:11px}.font-bold{font-weight:800}.text-muted{color:#a07080}.w-full{width:100%}
  .divider{border:none;border-top:1px solid rgba(201,133,106,0.2);margin:12px 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { createClient } = supabase;
const SUPABASE_URL = 'https://yldewrgtcuxiykorjiam.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsZGV3cmd0Y3V4aXlrb3JqaWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjYzODAsImV4cCI6MjA5NTcwMjM4MH0.FhdWhs92TdGrzSDGlB-KW6t2e-EYgCY9t-BVjnaAdss';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ==================== SUPABASE INIT ====================
async function initDB() {
