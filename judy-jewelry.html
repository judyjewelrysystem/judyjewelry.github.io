  --text:#111;--text2:#555;--text3:#888;
  --accent:#111;--accent2:#333;--accent-light:#f0f0f0;

}
[data-theme="rose"]{
  --bg:linear-gradient(145deg,#f8e8ea,#f5d0d8,#f0c8d4,#edd4c8);
  --bg2:rgba(255,255,255,0.6);--sidebar:rgba(255,255,255,0.3);
  --topbar:rgba(255,255,255,0.35);--card:rgba(255,255,255,0.55);
  --border:rgba(201,133,106,0.25);--border2:rgba(201,133,106,0.15);
  --text:#5a2a34;--text2:#8b4a5a;--text3:#c9856a;

}
[data-theme="latte"]{

  --topbar:rgba(255,248,235,0.32);--card:rgba(255,248,230,0.5);

  --bg2:rgba(248,242,255,0.5);--sidebar:rgba(248,242,255,0.25);
  --topbar:rgba(248,242,255,0.28);--card:rgba(248,242,255,0.48);
  --border:rgba(180,165,230,0.28);--border2:rgba(180,165,230,0.15);
  --text:#3a2870;--text2:#5848a0;--text3:#7058b0;

}
/* ===== BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);transition:background .3s}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--accent2,#ccc);border-radius:3px}
/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh;position:relative}
.sheen-layer{position:fixed;inset:0;background:var(--sheen);pointer-events:none;z-index:0}
.sidebar{width:210px;min-height:100vh;position:fixed;left:0;top:0;z-index:100;background:var(--sidebar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s}
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1}
.topbar{height:56px;background:var(--topbar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50;gap:12px}
.page{padding:20px;flex:1}
/* ===== SIDEBAR ===== */
.logo{padding:16px 14px;border-bottom:1px solid var(--border2)}
.logo-title{font-size:14px;font-weight:900;color:var(--text)}
.logo-sub{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--text3);margin-top:2px}
.nav{padding:8px 6px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:8px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:var(--accent-light)}
.nav-item.active{background:var(--nav-active);color:var(--text);border-left:3px solid var(--nav-border);padding-left:8px}
.nav-divider{border:none;border-top:1px solid var(--border2);margin:6px 8px}
.nav-link{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:8px;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;background:var(--accent-light);border:1px dashed var(--border);margin:4px 4px;text-decoration:none}
.user-area{padding:12px 14px;border-top:1px solid var(--border2)}
.user-name{font-size:13px;font-weight:800;color:var(--text)}
.user-role{font-size:11px;color:var(--text3);margin-top:1px}
.ua-btn{margin-top:6px;width:100%;padding:8px;border-radius:7px;border:1px solid var(--border);background:var(--accent-light);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.ua-btn:hover{opacity:.85}
.logout-btn{background:var(--btn-bg);color:var(--btn-text);border:none;margin-top:5px}
/* ===== CARDS ===== */
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:900;color:var(--text);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:12px;padding:14px 10px;text-align:center;border:1px solid var(--border)}
.stat-l{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:5px}
.stat-v{font-size:18px;font-weight:900;color:var(--text)}
/* ===== BUTTONS ===== */
.btn{padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:opacity .2s;font-family:inherit}
.btn:hover{opacity:.85}
.btn-p{background:var(--btn-bg);color:var(--btn-text)}
.btn-s{background:var(--accent-light);color:var(--text);border:1px solid var(--border)}
.btn-d{background:#fee;color:#c0392b;border:1px solid #fcc}
.btn-w{background:#fff3cd;color:#856404;border:1px solid #ffc107}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-xs{padding:4px 9px;font-size:11px}
/* Payment status */
.ps-unpaid{background:#fee2e2;color:#c0392b;border:1px solid #fca5a5}
.ps-deposit{background:#fff3cd;color:#856404;border:1px solid #fcd34d}
.ps-paid{background:#dcfce7;color:#16a34a;border:1px solid #86efac}
/* ===== FORMS ===== */
.fg{margin-bottom:12px}
.fl{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px}
.fc{width:100%;padding:10px 13px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px;font-weight:600;font-family:inherit;outline:none;transition:border .2s}
.fc:focus{border-color:var(--accent)}
textarea.fc{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* ===== TABLE ===== */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{background:var(--accent-light);color:var(--text);padding:11px 12px;font-size:12px;font-weight:800;text-align:left;white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border2);vertical-align:middle;color:var(--text2)}
tr:hover td{background:var(--accent-light)}
/* ===== BADGE ===== */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800}
.b-gold{background:linear-gradient(135deg,#f5c842,#e0a020);color:#5a3800}
.b-silver{background:linear-gradient(135deg,#d0d8e8,#a8b8cc);color:#2a3a5a}
.b-bronze{background:rgba(180,120,60,0.2);color:#6a3800}
.b-plat{background:linear-gradient(135deg,#e8e8f5,#c0c0e0);color:#3a3a7a}
.b-diam{background:linear-gradient(135deg,#b8e8f8,#80c8e8);color:#003a5a}
.b-on{background:#dcfce7;color:#16a34a;border:1px solid #86efac}
.b-off{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.mbox{background:var(--bg2,#fff);border-radius:16px;padding:22px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);border:1px solid var(--border)}
.mbox.wide{max-width:680px}
.mtitle{font-size:17px;font-weight:900;color:var(--text);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.mclose{cursor:pointer;font-size:20px;color:var(--text3);background:none;border:none;font-weight:900}
/* ===== MISC ===== */
.alert{padding:11px 14px;border-radius:8px;margin-bottom:12px;font-weight:700;font-size:13px}
.alert-ok{background:#dcfce7;color:#16a34a;border:1px solid #86efac}
.alert-err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.ptitle{font-size:19px;font-weight:900;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.sb{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sb input,.sb select{flex:1;min-width:150px}
.drop{position:absolute;z-index:30;width:100%;background:var(--bg2,#fff);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.12);max-height:200px;overflow-y:auto;display:none}
.drop-item{padding:9px 13px;cursor:pointer;font-size:13px;font-weight:700;border-bottom:1px solid var(--border2)}
.drop-item:hover{background:var(--accent-light)}
.img-up{border:2px dashed var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:var(--accent-light);font-size:13px;font-weight:700;color:var(--text3)}
.img-up:hover{border-color:var(--accent)}
.notif-dot{display:inline-block;width:8px;height:8px;background:#ef4444;border-radius:50%;margin-left:4px;vertical-align:middle}
.sc{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800}
.sc-p{background:#fff3cd;color:#856404;border:1px solid #fcd34d}
.sc-i{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}
.sc-d{background:#dcfce7;color:#16a34a;border:1px solid #86efac}
hr.dv{border:none;border-top:1px solid var(--border2);margin:10px 0}
.flex{display:flex}.aic{align-items:center}.jsb{justify-content:space-between}.gap2{gap:8px}.gap3{gap:12px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.w100{width:100%}
.theme-btns{display:flex;gap:6px;flex-wrap:wrap}
.theme-btn{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .2s}
.theme-btn:hover,.theme-btn.active{transform:scale(1.2);border-color:var(--text)}
/* ===== MOBILE ===== */
.menu-btn{display:none;background:none;border:none;font-size:26px;cursor:pointer;color:var(--text)}
.mob-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,0.15)}
  .main{margin-left:0}
  .menu-btn{display:block}
  .mob-ov.show{display:block}
  .fgrid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .page{padding:12px}
  .overlay{padding:0;align-items:flex-end}
  .mbox{border-radius:16px 16px 0 0;max-width:100%;max-height:92vh}
  .fc{font-size:16px}
}
</style>

<script>
const SURL='https://yldewrgtcuxiykorjiam.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsZGV3cmd0Y3V4aXlrb3JqaWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjYzODAsImV4cCI6MjA5NTcwMjM4MH0.FhdWhs92TdGrzSDGlB-KW6t2e-EYgCY9t-BVjnaAdss';
const sb=supabase.createClient(SURL,SKEY);

// ===== CONSTANTS =====
const SESS='judy_v4';const THEME_KEY='judy_theme';
const PAY_METHODS=['現金','刷卡','轉帳','LINE Pay','貨到付款','微信支付','支付寶'];
const LEVELS=[{k:'bronze',l:'一般會員(銅卡)',c:'b-bronze',min:0},{k:'silver',l:'銀卡',c:'b-silver',min:12001},{k:'gold',l:'金卡',c:'b-gold',min:30001},{k:'platinum',l:'白金VIP',c:'b-plat',min:50001},{k:'diamond',l:'鑽石VVIP',c:'b-diam',min:100001}];
const CATS=['戒指','項鍊','耳環','耳釘','手環','手鍊','手鐲','手珠串','腳鍊','吊墜','擺飾'];
const MATS=['純銀','黃金','白金','玫瑰金','22K','18K','14K','10K'];
const THEMES={white:{label:'⬜',bg:'',title:'白底黑字'},rose:{label:'🌹',bg:'rose',title:'玫瑰金'},latte:{label:'🧋',bg:'latte',title:'奶茶裸膚'},lavender:{label:'💜',bg:'lavender',title:'薰衣草紫'}};

// ===== HELPERS =====
const fmt=n=>n==null?'—':'NT$'+Number(n).toLocaleString('zh-TW');
const fmtD=d=>d?new Date(d).toLocaleDateString('zh-TW'):'—';
const getS=()=>{try{return JSON.parse(localStorage.getItem(SESS))}catch{return null}};
const saveS=u=>localStorage.setItem(SESS,JSON.stringify(u));
const clearS=()=>localStorage.removeItem(SESS);
const getLevel=s=>{let l=LEVELS[0];for(const x of LEVELS)if(s>=x.min)l=x;return l;};
const getLvK=k=>LEVELS.find(l=>l.k===k)||LEVELS[0];
let currentUser=getS();
let activeCharts=[];

function destroyCharts(){activeCharts.forEach(c=>{try{c.destroy()}catch{}});activeCharts=[];}

// ===== FLASH =====
function flash(type,msg){
  const d=document.getElementById('flash');
  d.innerHTML=`<div class="alert alert-${type==='ok'?'ok':'err'}" style="box-shadow:0 4px 20px rgba(0,0,0,0.1)">${msg}</div>`;
  setTimeout(()=>{if(d)d.innerHTML=''},3000);
}

// ===== MODAL =====
function openModal(title,html,wide=false){
  document.getElementById('modal-ov')?.remove();
  const ov=document.createElement('div');
  ov.className='overlay';ov.id='modal-ov';
  ov.innerHTML=`<div class="mbox${wide?' wide':''}"><div class="mtitle">${title}<button class="mclose" id="mcl">×</button></div><div id="mbody">${html}</div></div>`;
  document.body.appendChild(ov);
  document.getElementById('mcl').onclick=closeModal;
  ov.onclick=e=>{if(e.target===ov)closeModal();};
  return document.getElementById('mbody');
}
function closeModal(){document.getElementById('modal-ov')?.remove();}
function showAlert(id,type,msg){const el=document.getElementById(id);if(el)el.innerHTML=`<div class="alert alert-${type==='ok'?'ok':'err'}">${msg}</div>`;}

// ===== THEME =====
function applyTheme(t){
  const theme=THEMES[t]||THEMES.white;
  document.documentElement.dataset.theme=theme.bg||'';
  localStorage.setItem(THEME_KEY,t);
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
}

// ===== DROPDOWN SEARCH =====
function bindDropSearch(inputId,dropId,items,renderFn,selectFn){
  const inp=document.getElementById(inputId);
  const drop=document.getElementById(dropId);
  if(!inp||!drop)return;
  inp.oninput=()=>{
    const v=inp.value.toLowerCase();
    if(!v){drop.style.display='none';return;}
    const res=items.filter(renderFn.filter?renderFn.filter(v):x=>(x.name||x.sku||'').toLowerCase().includes(v)).slice(0,8);
    if(!res.length){drop.style.display='none';return;}
    drop.innerHTML=res.map(x=>renderFn.row(x)).join('');
    drop.style.display='block';
    drop.querySelectorAll('.drop-item').forEach(el=>el.onclick=()=>{selectFn(el);drop.style.display='none';});
  };
  document.addEventListener('click',e=>{if(!inp.contains(e.target)&&!drop.contains(e.target))drop.style.display='none';},{once:true});
}

// ===== IMAGE UPLOAD =====
async function uploadImg(file,key){
  const ext=file.name.split('.').pop();
  const path=`${key}/${Date.now()}.${ext}`;
  const {error}=await sb.storage.from('jewelry-images').upload(path,file,{upsert:true});
  if(!error){const {data}=sb.storage.from('jewelry-images').getPublicUrl(path);return data.publicUrl;}
  return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});
}
function imgUploadField(id,val='',label='上傳照片'){
  return`<div class="fg"><label class="fl">${label}</label>
    <div class="img-up" onclick="document.getElementById('${id}-f').click()">${val?`<img src="${val}" style="max-width:100%;max-height:120px;border-radius:8px;object-fit:cover">`:`📷 點擊上傳`}</div>
    <input type="file" id="${id}-f" accept="image/*" style="display:none" onchange="handleImgUpload('${id}',this)">
    <input type="hidden" id="${id}" value="${val}">
    ${val?`<button class="btn btn-d btn-xs" style="margin-top:4px" onclick="document.getElementById('${id}').value='';document.getElementById('${id}-f').value='';this.previousElementSibling.previousElementSibling.innerHTML='📷 點擊上傳'">移除</button>`:''}
  </div>`;
}
window.handleImgUpload=async(id,input)=>{
  const file=input.files[0];if(!file)return;
  const url=await uploadImg(file,id);
  document.getElementById(id).value=url;
  const up=input.previousElementSibling;
  up.innerHTML=`<img src="${url}" style="max-width:100%;max-height:120px;border-radius:8px;object-fit:cover">`;
};

// ===== NOTIFICATIONS =====
async function addNotif(type,title,message,relatedId='',relatedType=''){
  await sb.from('judy_notifications').insert({type,title,message,related_id:relatedId||null,related_type:relatedType,created_by:currentUser?.display_name||''});
}
async function getUnreadCount(){
  if(currentUser?.role!=='boss')return 0;
  const{count}=await sb.from('judy_notifications').select('*',{count:'exact',head:true}).eq('is_read',false);
  return count||0;
}

// ===== PAY STATUS BUTTONS =====
function payStatusBtns(current='unpaid'){
  const opts=[{v:'unpaid',l:'未付款',c:'ps-unpaid'},{v:'deposit',l:'只收訂金',c:'ps-deposit'},{v:'paid',l:'已付清',c:'ps-paid'}];
  return opts.map(o=>`<button class="btn btn-sm ${o.c}${current===o.v?' pay-active':''}" style="${current===o.v?'outline:2px solid currentColor;':''}" data-pstatus="${o.v}" onclick="selectPayStatus(this,'${o.v}')">${o.l}</button>`).join('');
}
window.selectPayStatus=(btn,val)=>{
  const container=btn.closest('.pay-status-group');
  if(container){container.querySelectorAll('[data-pstatus]').forEach(b=>b.style.outline='');btn.style.outline='2px solid currentColor';}
  const hidden=btn.closest('.fg')?.querySelector('[id$="-pstatus"]')||document.getElementById('pay-status-val');
  if(hidden)hidden.value=val;
};
function payMethodSelect(id,val=''){
  return`<select class="fc" id="${id}"><option value="">選擇收款方式</option>${PAY_METHODS.map(m=>`<option${val===m?' selected':''}>${m}</option>`).join('')}</select>`;
}

// ===== RENDER APP =====
function renderApp(){
  const app=document.getElementById('app');
  if(!currentUser){renderLogin(app);return;}
  applyTheme(localStorage.getItem(THEME_KEY)||'white');
  renderLayout(app);
}

// ===== LOGIN =====
function renderLogin(app){
  app.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
    <div class="card" style="width:100%;max-width:380px;padding:36px 28px">
      <div style="text-align:center;margin-bottom:24px">
        <div style="font-size:38px">💎</div>
        <div style="font-size:18px;font-weight:900;color:var(--text);margin-top:6px">ＪＵＤＹ珠寶</div>
        <div style="font-size:11px;color:var(--text3);letter-spacing:2px;font-weight:700">INVENTORY SYSTEM</div>
      </div>
      <div id="l-err"></div>
      <div class="fg"><label class="fl">👤 帳號</label><input class="fc" id="l-u" placeholder="請輸入帳號" autocomplete="username"></div>
      <div class="fg"><label class="fl">🔒 密碼</label><input class="fc" id="l-p" type="password" placeholder="請輸入密碼" autocomplete="current-password"></div>
      <button class="btn btn-p w100" id="l-btn" style="justify-content:center;font-size:15px;padding:12px;margin-top:4px">🔑 登入系統</button>
    </div></div>`;
  const doLogin=async()=>{
    const u=document.getElementById('l-u').value.trim(),p=document.getElementById('l-p').value;
    if(!u||!p){showAlert('l-err','err','請填寫帳號與密碼');return;}
    document.getElementById('l-btn').textContent='登入中...';
    const{data,error}=await sb.from('judy_users').select('*').eq('username',u).maybeSingle();
    document.getElementById('l-btn').textContent='🔑 登入系統';
    if(error||!data){showAlert('l-err','err','帳號不存在');return;}
    if(data.password!==p){showAlert('l-err','err','密碼錯誤');return;}
    currentUser=data;saveS(data);renderApp();
  };
  document.getElementById('l-btn').onclick=doLogin;
  document.getElementById('l-p').onkeydown=e=>{if(e.key==='Enter')doLogin();};
}

// ===== LAYOUT =====
let curPage='dashboard';let sideOpen=false;
function renderLayout(app){
  const isBoss=currentUser.role==='boss';
  const isMgr=currentUser.role==='manager';
  const navItems=[
    {id:'dashboard',icon:'📊',label:'儀表板'},
    {id:'inventory',icon:'💍',label:'庫存管理'},
    {id:'sales',icon:'🛍️',label:'銷售記錄'},
    {id:'customers',icon:'👤',label:'客戶資料庫'},
    {id:'repairs',icon:'🔧',label:'維修保養'},
    ...((isBoss||isMgr)?[{id:'reports',icon:'📈',label:'報表分析'}]:[]),
    {id:'users',icon:'👥',label:'帳號管理'},
  ];
  app.innerHTML=`
  <div class="sheen-layer"></div>
  <div class="mob-ov" id="mob-ov"></div>
  <nav class="sidebar" id="sidebar">
    <div class="logo">
      <div style="font-size:24px;margin-bottom:4px">💎</div>
      <div class="logo-title">ＪＵＤＹ珠寶</div>
      <div class="logo-sub">INVENTORY SYSTEM</div>
    </div>
    <div class="nav" id="nav-list"></div>
    <div class="user-area">
      <div style="font-size:11px;font-weight:700;color:var(--text3);margin-bottom:6px">🎨 主題</div>
      <div class="theme-btns">${Object.entries(THEMES).map(([k,v])=>`<div class="theme-btn" data-t="${k}" title="${k}" style="background:${k==='white'?'#fff':k==='rose'?'linear-gradient(135deg,#f5d0d8,#c9856a)':k==='latte'?'linear-gradient(135deg,#ece0d0,#c8a050)':'linear-gradient(135deg,#e4dcf8,#8070c8)'}" onclick="applyTheme('${k}')"></div>`).join('')}</div>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn">☰</button>
      <div id="tb-title" style="font-weight:900;font-size:15px;color:var(--text);flex:1;text-align:center"></div>
      <div style="display:flex;align-items:center;gap:8px">
        ${isBoss?`<button class="btn btn-sm" id="notif-btn" style="position:relative;padding:6px 10px">🔔<span id="notif-count" class="notif-dot" style="display:none"></span></button>`:''}
        <div style="font-size:11px;color:var(--text3);font-weight:700;display:none" class="topbar-date">${new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric'})}</div>
        <button onclick="navigate('users')" style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--accent-light);color:var(--text);font-size:13px;font-weight:700;cursor:pointer">👤 ${currentUser.display_name}</button>
        <button id="logout-btn" class="btn btn-sm" style="background:var(--btn-bg);color:var(--btn-text);padding:6px 12px;font-size:13px">🚪 登出</button>
      </div>
    </div>
    <div class="page" id="pc"></div>
  </div>`;

  // Nav
  const nl=document.getElementById('nav-list');
  navItems.forEach(n=>{
    const b=document.createElement('button');
    b.className='nav-item';b.id='nav-'+n.id;
    b.innerHTML=`<span>${n.icon}</span>${n.label}`;
    b.onclick=()=>navigate(n.id);
    nl.appendChild(b);
  });
  // Borrow link
  const link=document.createElement('a');
  link.className='nav-link';link.href='borrow.html';link.target='_blank';
  link.innerHTML='🏪 廠商借還專頁 →';
  nl.appendChild(document.createElement('hr').cloneNode());
  nl.lastChild.className='nav-divider';
  nl.appendChild(link);

  document.getElementById('logout-btn').onclick=()=>{clearS();currentUser=null;renderApp();};

  document.getElementById('menu-btn').onclick=()=>toggleSidebar();
  document.getElementById('mob-ov').onclick=()=>toggleSidebar(false);
  if(isBoss){
    document.getElementById('notif-btn').onclick=()=>showNotifications();
    updateNotifBadge();

}

function toggleSidebar(f){
  sideOpen=f!==undefined?f:!sideOpen;
  document.getElementById('sidebar')?.classList.toggle('open',sideOpen);
  document.getElementById('mob-ov')?.classList.toggle('show',sideOpen);
}
function navigate(page){
  curPage=page;sideOpen=false;toggleSidebar(false);destroyCharts();
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.id==='nav-'+page));
  const nb=document.getElementById('nav-'+page);
  if(nb)document.getElementById('tb-title').textContent=nb.textContent.trim();
  const pc=document.getElementById('pc');
  if(!pc)return;
  pc.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3);font-weight:700">⏳ 載入中...</div>';
  ({dashboard:renderDashboard,inventory:renderInventory,sales:renderSales,customers:renderCustomers,repairs:renderRepairs,reports:renderReports,users:renderUsers})[page]?.(pc);
}
async function updateNotifBadge(){
  const n=await getUnreadCount();
  const el=document.getElementById('notif-count');
  if(el)el.style.display=n>0?'inline-block':'none';
}

// ===== CHANGE PASSWORD =====
function showChangePwd(){
  openModal('🔑 修改密碼',`<div style="padding:10px 14px;background:var(--accent-light);border-radius:8px;margin-bottom:14px;font-weight:700;font-size:13px">帳號：<b>${currentUser.username}</b></div>
  <div id="pw-a"></div>
  <div class="fg"><label class="fl">舊密碼</label><input class="fc" id="pw-o" type="password"></div>
  <div class="fg"><label class="fl">新密碼（至少4碼）</label><input class="fc" id="pw-n" type="password"></div>
  <div class="fg"><label class="fl">確認新密碼</label><input class="fc" id="pw-c" type="password"></div>
  <div id="pw-match" style="font-size:12px;font-weight:700;margin-bottom:10px"></div>
  <div class="flex gap2" style="justify-content:flex-end">
    <button class="btn btn-s" onclick="closeModal()">取消</button>
    <button class="btn btn-p" id="pw-save">💾 確認修改</button>
  </div>`);
  ['pw-n','pw-c'].forEach(id=>document.getElementById(id).oninput=()=>{
    const n=document.getElementById('pw-n').value,c=document.getElementById('pw-c').value;
    document.getElementById('pw-match').innerHTML=n&&c?(n===c?'<span style="color:#16a34a">✅ 密碼一致</span>':'<span style="color:#c0392b">❌ 密碼不一致</span>'):'';
  });
  document.getElementById('pw-save').onclick=async()=>{
    const o=document.getElementById('pw-o').value,n=document.getElementById('pw-n').value,c=document.getElementById('pw-c').value;
    if(!o||!n||!c){showAlert('pw-a','err','請填寫所有欄位');return;}
    if(n!==c){showAlert('pw-a','err','新密碼不一致');return;}
    if(n.length<4){showAlert('pw-a','err','密碼至少4個字元');return;}
    const{data}=await sb.from('judy_users').select('id').eq('id',currentUser.id).eq('password',o).maybeSingle();
    if(!data){showAlert('pw-a','err','舊密碼錯誤');return;}
    await sb.from('judy_users').update({password:n}).eq('id',currentUser.id);
    currentUser.password=n;saveS(currentUser);
    showAlert('pw-a','ok','✅ 密碼已修改！');setTimeout(closeModal,1200);
  };
}

// ===== DASHBOARD =====
async function renderDashboard(pc){
  const now=new Date();
  const thisM=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const[{data:sales},{data:prods},{data:repairs},{data:borrows}]=await Promise.all([
    sb.from('judy_sales').select('total,sold_at,product_id'),
    sb.from('judy_products').select('price,stock,category,status,cost'),
    sb.from('judy_repairs').select('status,payment_status,final_amount'),
    sb.from('judy_borrow_records').select('status,direction')
  ]);
  const s=sales||[],p=prods||[],r=repairs||[],b=borrows||[];
  const thisMS=s.filter(x=>x.sold_at?.startsWith(thisM)).reduce((a,x)=>a+Number(x.total),0);
  const activeP=p.filter(x=>x.status==='active');
  const stockVal=activeP.reduce((a,x)=>a+(Number(x.price)*Number(x.stock||0)),0);
  const pendingR=r.filter(x=>x.status!=='done').length;
  const consignIn=b.filter(x=>x.status==='borrowed'&&x.direction==='in').length;
  const consignOut=b.filter(x=>x.status==='borrowed'&&x.direction==='out').length;
  const now2=new Date();now2.setHours(0,0,0,0);
  const overdueCount=b.filter(x=>x.status==='borrowed'&&x.expected_return&&new Date(x.expected_return)<now2).length;
  const catMap={};activeP.forEach(x=>{if(x.category)catMap[x.category]=(catMap[x.category]||0)+1;});

  // Monthly 6 months
  const mLabels=[],mData=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;mLabels.push(`${d.getMonth()+1}月`);mData.push(s.filter(x=>x.sold_at?.startsWith(k)).reduce((a,x)=>a+Number(x.total),0));}

  pc.innerHTML=`
  <div class="ptitle">📊 儀表板</div>
  <div class="stats">
    <div class="stat"><div class="stat-l">本月銷售額</div><div class="stat-v" style="color:var(--accent)">${fmt(thisMS)}</div></div>
    <div class="stat"><div class="stat-l">庫存總值</div><div class="stat-v">${fmt(stockVal)}</div></div>
    <div class="stat"><div class="stat-l">在架商品</div><div class="stat-v">${activeP.length} 件</div></div>
    <div class="stat"><div class="stat-l">待維修</div><div class="stat-v" style="color:${pendingR>0?'#c0392b':'#16a34a'}">${pendingR} 筆</div></div>
    <div class="stat"><div class="stat-l">廠商寄賣中</div><div class="stat-v" style="color:var(--accent)">${consignIn} 件</div></div>
    <div class="stat"><div class="stat-l">外借商品中</div><div class="stat-v" style="color:var(--accent2,var(--accent))">${consignOut} 件</div></div>
    <div class="stat"><div class="stat-l">⚠️ 逾期未還</div><div class="stat-v" style="color:${overdueCount>0?'#c0392b':'#16a34a'}">${overdueCount} 筆</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="card"><div class="card-title">📈 近6月銷售走勢</div><div style="height:200px"><canvas id="ch-line"></canvas></div></div>
    <div class="card"><div class="card-title">💍 商品類別分布</div><div style="height:200px"><canvas id="ch-pie"></canvas></div></div>
  </div>`;

  // Line chart
  const lc=new Chart(document.getElementById('ch-line').getContext('2d'),{type:'line',data:{labels:mLabels,datasets:[{label:'銷售額',data:mData,borderColor:getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#111',backgroundColor:'rgba(0,0,0,0.05)',tension:0.4,pointRadius:4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{font:{size:11}},grid:{color:'rgba(0,0,0,0.05)'}},x:{ticks:{font:{size:11}},grid:{display:false}}}}});
  activeCharts.push(lc);
  // Pie chart
  if(Object.keys(catMap).length>0){
    const pc2=new Chart(document.getElementById('ch-pie').getContext('2d'),{type:'doughnut',data:{labels:Object.keys(catMap),datasets:[{data:Object.values(catMap),backgroundColor:['#c9856a','#8b3a4a','#f5d0d8','#c8a050','#8070c8','#27ae60','#e67e22'],borderWidth:2,borderColor:'rgba(255,255,255,0.8)'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12}}}}});
    activeCharts.push(pc2);
  }
}

// ===== INVENTORY =====
let invProds=[],invSups=[],invCats=[],invMats=[],invGems=[];
async function renderInventory(pc){
  const[{data:prods},{data:sups},{data:cats},{data:borrows}]=await Promise.all([
    sb.from('judy_products').select('*').order('created_at',{ascending:false}),
    sb.from('judy_suppliers').select('*').order('name'),
    sb.from('judy_categories').select('*').order('name'),
    sb.from('judy_borrow_records').select('product_id,status,direction,actual_return,borrow_date,expected_return,created_at,supplier_id,supplier_name').order('created_at',{ascending:false})
  ]);
  // 建立 product_id → 最新 borrow record 的對照
  // 優先顯示最新的 borrowed 狀態，若都歸還則顯示最新一筆
  const borrowMap={};
  // borrows 已按 created_at desc 排序，所以第一筆就是最新的
  (borrows||[]).forEach(br=>{
    if(!br.product_id) return;
    const existing=borrowMap[br.product_id];
    if(!existing){borrowMap[br.product_id]=br;return;}
    // 優先保留 borrowed 狀態（未歸還）
    if(br.status==='borrowed'&&existing.status!=='borrowed') borrowMap[br.product_id]=br;
    // 同樣狀態取最新（created_at 更大）
    else if(br.status===existing.status&&br.created_at>existing.created_at) borrowMap[br.product_id]=br;
  });
  invProds=prods||[];invSups=sups||[];
  invCats=[...CATS,...(cats||[]).filter(x=>x.type==='category').map(x=>x.name)];
  invMats=[...MATS,...(cats||[]).filter(x=>x.type==='material').map(x=>x.name)];
  invGems=['紅寶石','藍寶石',...(cats||[]).filter(x=>x.type==='gemstone').map(x=>x.name)];
  invGems=['紅寶石','藍寶石',...(cats||[]).filter(x=>x.type==='gemstone').map(x=>x.name)];
  const isBoss=currentUser.role==='boss';

  pc.innerHTML=`
  <div class="flex aic jsb mb3"><div class="ptitle" style="margin:0">💍 庫存管理</div><button class="btn btn-p" onclick="openProdModal(null)">＋ 新增商品</button></div>
  <div class="sb">
    <input class="fc" id="inv-s" placeholder="🔍 搜尋名稱、貨號...">
    <select class="fc" id="inv-c" style="max-width:150px"><option value="">所有類別</option>${invCats.map(c=>`<option>${c}</option>`).join('')}</select>
    <select class="fc" id="inv-st" style="max-width:120px"><option value="">全部狀態</option><option value="active">上架</option><option value="inactive">下架</option></select>
    <select class="fc" id="inv-type" style="max-width:130px" onchange="renderInvRows()">
      <option value="">全部類型</option>
      <option value="own">公司</option>
      <option value="in">廠商寄賣</option>
      <option value="out">外借商品</option>
    </select>
    <button class="btn btn-s btn-sm" onclick="exportInvCSV()">📥 匯出CSV</button>
  </div>
  <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table>
    <thead><tr><th>貨號</th><th>照片</th><th>商品名稱</th><th>類別</th><th>材質</th><th>寶石</th>${isBoss?'<th>成本</th>':''}<th>售價</th><th>庫存</th><th>類型</th><th>廠商</th><th>借出日期</th><th>預計歸還</th><th>狀態</th><th>操作</th></tr></thead>
    <tbody id="inv-body"></tbody>
  </table></div></div>`;

  window.renderInvRows=()=>render();
  const render=()=>{
    const s=document.getElementById('inv-s').value.toLowerCase();
    const c=document.getElementById('inv-c').value;
    const st=document.getElementById('inv-st').value;
    const typeFilter=document.getElementById('inv-type')?.value||'';
    const f=invProds.filter(p=>{
      const dir=p.direction||'own';
      return (!s||(p.name?.toLowerCase().includes(s)||p.sku?.toLowerCase().includes(s)))
        &&(!c||p.category===c)&&(!st||p.status===st)
        &&(!typeFilter||dir===typeFilter);
    }).sort((a,b)=>{
      // 下架商品排最後
      if(a.status==='active'&&b.status!=='active') return -1;
      if(a.status!=='active'&&b.status==='active') return 1;
      return 0;
    });
    document.getElementById('inv-body').innerHTML=f.length===0?`<tr><td colspan="${isBoss?15:14}" style="text-align:center;padding:28px;color:var(--text3);font-weight:700">暫無商品</td></tr>`:
    f.map(p=>`<tr>
      <td><code style="font-size:11px;background:var(--accent-light);padding:2px 6px;border-radius:4px">${p.sku||'—'}</code></td>
      <td>${p.image1?`<img src="${p.image1}" style="width:42px;height:42px;object-fit:cover;border-radius:8px">`:'<span style="color:var(--text3);font-size:11px">無</span>'}</td>
      <td style="font-weight:800">${p.name}</td>
      <td>${p.category||'—'}</td><td>${p.material||'—'}</td><td>${p.gemstone||'—'}</td>
      ${isBoss?`<td>${p.cost?fmt(p.cost):'<span style="color:#ef4444;font-size:11px">未填</span>'}</td>`:''}
      <td style="font-weight:800;color:var(--accent)">${fmt(p.price)}</td>
      <td style="font-weight:800">${p.stock}</td>
      ${(()=>{
        const br=borrowMap[p.id];
        const dir=p.direction||'own';
        const brStatus=br?.status||'';
        // 類型 badge
        const typeBadge=dir==='in'?'<span class="badge" style="background:#dbeafe;color:#1d4ed8;font-size:11px">廠商寄賣</span>':dir==='out'?'<span class="badge" style="background:#fef3c7;color:#92400e;font-size:11px">外借商品</span>':'<span class="badge" style="background:var(--accent-light);color:var(--text);font-size:11px">公司</span>';
        // 廠商名稱
        const supName=dir!=='own'?(invSups.find(s=>s.id===p.borrow_supplier_id)?.name||'—'):'—';
        // 借出日期
        // 優先用 products 表的 borrow_date（使用者最後儲存的）
        const borrowDate=p.borrow_date?fmtD(p.borrow_date):(br?.borrow_date?fmtD(br.borrow_date):'—');
        // 預計歸還/實際歸還/狀態
        let dateCell='—';let statusExtra='';
        if(dir!=='own'){
          if(brStatus==='returned'||brStatus==='settled'){
            dateCell='<span style="color:#16a34a;font-weight:700">✅ '+fmtD(br?.actual_return)+'（已歸還）</span>';
          } else if(brStatus==='sold_pending'){
            dateCell='<span style="color:#7c3aed;font-weight:700">💰 待結算</span>';
          } else {
            // 優先用 products.borrow_return_date（最新儲存），其次 borrow_records
            const retDate=p.borrow_return_date||br?.expected_return||null;
            if(retDate){
              const over=new Date(retDate);over.setHours(23,59,59,999);
              if(over<new Date()) dateCell='<span style="color:#c0392b;font-weight:700">⚠️ '+fmtD(retDate)+'（逾期）</span>';
              else dateCell=fmtD(retDate);
            }
          }
          // 狀態額外標籤
          if(brStatus==='returned') statusExtra='<span class="badge b-ret" style="font-size:10px;margin-left:3px">已歸還</span>';
          else if(brStatus==='settled') statusExtra='<span class="badge" style="background:#f3e8ff;color:#7c3aed;border:1px solid #c4b5fd;font-size:10px;margin-left:3px">已結算</span>';
          else if(brStatus==='sold_pending') statusExtra='<span class="badge b-sold" style="font-size:10px;margin-left:3px">待結算</span>';
          else if(p.is_borrowed) statusExtra='<span class="badge b-in" style="font-size:10px;margin-left:3px">借出中</span>';
        }
        return '<td>'+typeBadge+'</td><td style="font-size:12px;font-weight:700;color:var(--accent)">'+supName+'</td><td style="font-size:12px">'+borrowDate+'</td><td style="font-size:12px">'+dateCell+'</td><td><span class="badge '+(p.status==='active'?'b-on':'b-off')+'">'+(p.status==='active'?'上架':'下架')+'</span>'+statusExtra+'</td>';
      })()}
      <td><div class="flex gap2">
        <button class="btn btn-s btn-xs" onclick="openProdModal('${p.id}')">✏️</button>
        ${isBoss?`<button class="btn btn-d btn-xs" onclick="deleteProd('${p.id}')">🗑️</button>`:''}
      </div></td>
    </tr>`).join('');
  };
  render();
  ['inv-s','inv-c','inv-st'].forEach(id=>document.getElementById(id).oninput=render);
  document.getElementById('inv-c').onchange=render;
  document.getElementById('inv-st').onchange=render;
  window.exportInvCSV=()=>{
    // 依目前篩選條件匯出
    const s=document.getElementById('inv-s').value.toLowerCase();
    const cv=document.getElementById('inv-c').value;
    const st=document.getElementById('inv-st').value;
    const typeFilter=document.getElementById('inv-type')?.value||'';
    const filtered=invProds.filter(p=>{
      const dir=p.direction||'own';
      return (!s||(p.name?.toLowerCase().includes(s)||p.sku?.toLowerCase().includes(s)))
        &&(!cv||p.category===cv)&&(!st||p.status===st)
        &&(!typeFilter||dir===typeFilter);
    });
    const rows=[['貨號','商品名稱','類別','材質','寶石','成本','售價','庫存','類型','廠商','借出日期','預計歸還','狀態'],
      ...filtered.map(p=>{const br=borrowMap[p.id];const dir=p.direction||'own';const sup=dir!=='own'?(invSups.find(s=>s.id===p.borrow_supplier_id)?.name||''):'';return[p.sku||'',p.name,p.category||'',p.material||'',p.gemstone||'',p.cost||'',p.price,p.stock,dir==='in'?'廠商寄賣':dir==='out'?'外借商品':'公司',sup,br?.borrow_date||'',br?.expected_return||'',p.status==='active'?'上架':'下架'];})];
    const nl='\n';const csv=rows.map(r=>r.map(x=>'"'+String(x==null?'':x)+'"').join(',')).join(nl);
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='庫存清單_'+new Date().toLocaleDateString('zh-TW')+'.csv';a.click();
  };
}

  };

window.deleteSale=async(id,pid,qty,cid,total)=>{

  };

  document.getElementById('rm-save').onclick=async()=>{
    const item=document.getElementById('rm-item').value.trim();
    if(!item){showAlert('rm-a','err','請填寫維修物品');return;}
    const cid=document.getElementById('rm-cid').value;
    const supEl=document.getElementById('rm-sup');
    const supId=supEl.value;const supName=supEl.options[supEl.selectedIndex]?.dataset.name||'';
    const quote=parseFloat(document.getElementById('rm-quote').value)||0;
    const dep=parseFloat(document.getElementById('rm-dep').value)||0;
    const finalAmt=parseFloat(document.getElementById('rm-amt').value)||0;
    const pStatus=document.getElementById('pay-status-val').value;
    const payload={
      customer_id:cid||null,
      customer_name:document.getElementById('rm-cname').value||cuInp.value||'',
      customer_phone:document.getElementById('rm-cphone').value||'',
      item_desc:item,issue:document.getElementById('rm-issue').value,
      status:document.getElementById('rm-status').value,
      repair_supplier_id:supId||null,repair_supplier_name:supName,
      quote,deposit:dep,
      deposit_date:document.getElementById('rm-dep-date').value||null,
      deposit_method:document.getElementById('rm-dep-pay').value||null,
      final_amount:finalAmt,
      final_date:document.getElementById('rm-amt-date').value||null,
      payment_status:pStatus,
      payment_method:document.getElementById('rm-pay').value,
      receive_date:document.getElementById('rm-rdate').value||null,
      estimate_date:document.getElementById('rm-edate').value||null,
      complete_date:document.getElementById('rm-cdate').value||null,
      photo:document.getElementById('rm-photo').value||null,
      note:document.getElementById('rm-note').value
    };
    let oldAmt=0;
    if(r){
      oldAmt=r.final_amount||0;
      await sb.from('judy_repairs').update(payload).eq('id',r.id);
    } else {
      payload.repair_no='R'+Date.now().toString().slice(-7);
      await sb.from('judy_repairs').insert(payload);
    }
    // 更新客戶累積消費（只計完款金額變動）
    if(cid&&finalAmt>=0){
      const{data:cu}=await sb.from('judy_customers').select('*').eq('id',cid).maybeSingle();
      if(cu){const ns=Math.max(0,(cu.total_spent||0)-oldAmt+finalAmt);const lv=getLevel(ns);await sb.from('judy_customers').update({total_spent:ns,...(!cu.level_override?{level:lv.k}:{})}).eq('id',cid);}
    }
    flash('ok',r?'維修單已更新':'維修單已建立');
    closeModal();renderRepairs(document.getElementById('pc'));
  };
};

// ===== REPORTS =====
async function renderReports(pc){
  const isBoss=currentUser.role==='boss';
  const from=`${new Date().getFullYear()}-01-01`;
  const to=new Date().toISOString().split('T')[0];
  pc.innerHTML=`
  <div class="ptitle">📈 報表分析</div>
  <div class="card mb3 flex gap3 aic" style="flex-wrap:wrap;padding:14px 16px">
    <span style="font-weight:700;font-size:13px">📅</span>
    <input class="fc" id="rp-from" type="date" value="${from}" style="width:auto">
    <span style="font-weight:700;color:var(--text3)">至</span>
    <input class="fc" id="rp-to" type="date" value="${to}" style="width:auto">
    <button class="btn btn-p btn-sm" id="rp-load">查詢</button>
    <button class="btn btn-s btn-sm" id="rp-export">📥 匯出CSV</button>
  </div>
  <div id="rp-tabs" style="display:flex;gap:4px;margin-bottom:16px;background:var(--accent-light);padding:4px;border-radius:12px;border:1px solid var(--border)">
    <button class="rtab active" data-t="overview" onclick="rpTab(this)">📋 總覽</button>
    <button class="rtab" data-t="hot" onclick="rpTab(this)">🔥 熱銷</button>
    ${isBoss?'<button class="rtab" data-t="profit" onclick="rpTab(this)">💰 利潤</button>':''}
    ${isBoss?'<button class="rtab" data-t="settle" onclick="rpTab(this)">🏪 廠商結算</button>':''}
  </div>
  <div id="rp-content"></div>`;

  document.querySelectorAll('.rtab').forEach(b=>{
    b.style.cssText='flex:1;padding:9px;text-align:center;border-radius:9px;font-weight:800;font-size:13px;color:var(--text2);border:none;background:none;cursor:pointer;font-family:inherit';
  });
  const setActive=b=>{document.querySelectorAll('.rtab').forEach(x=>{x.style.background='';x.style.color='var(--text2)';x.style.boxShadow='';});b.style.background='var(--card)';b.style.color='var(--text)';b.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)';};
  setActive(document.querySelector('.rtab.active'));

  let rpSales=[],rpProds=[],rpSettle=[];

  const loadData=async()=>{
    const frv=document.getElementById('rp-from').value;
    const tov=document.getElementById('rp-to').value+'T23:59:59';
    const[{data:s},{data:p},{data:st}]=await Promise.all([
      sb.from('judy_sales').select('*').gte('sold_at',frv).lte('sold_at',tov).order('sold_at'),
      sb.from('judy_products').select('*'),
      isBoss?sb.from('judy_settlements').select('*').order('settled_at',{ascending:false}):Promise.resolve({data:[]})
    ]);
    rpSales=s||[];rpProds=p||[];rpSettle=st||[];
    const cur=document.querySelector('.rtab.active');
    renderRpContent(cur?.dataset.t||'overview');
  };

  window.rpTab=(btn)=>{setActive(btn);renderRpContent(btn.dataset.t);};

  const renderRpContent=(tab)=>{
    destroyCharts();
    const c=document.getElementById('rp-content');
    const totalRev=rpSales.reduce((a,x)=>a+Number(x.total),0);
    const totalCost=rpSales.reduce((a,x)=>a+Number(x.cost||0)*Number(x.qty||1),0);
    const totalProfit=totalRev-totalCost;
    const activeP=rpProds.filter(p=>p.status==='active');
    const stockVal=activeP.reduce((a,x)=>a+(Number(x.price)*Number(x.stock||0)),0);

    if(tab==='overview'){
      const mm={};
      rpSales.forEach(s=>{const m=s.sold_at?.slice(0,7);if(m){mm[m]=(mm[m]||0)+Number(s.total);}});
      const mKeys=Object.keys(mm).sort();
      c.innerHTML=`
      <div class="stats">
        <div class="stat"><div class="stat-l">累積銷售額</div><div class="stat-v" style="color:var(--accent)">${fmt(totalRev)}</div></div>
        <div class="stat"><div class="stat-l">庫存售價值</div><div class="stat-v">${fmt(stockVal)}</div></div>
        <div class="stat"><div class="stat-l">銷售筆數</div><div class="stat-v">${rpSales.length}</div></div>
      </div>
      <div class="card"><div class="card-title">📈 月銷售趨勢</div><div style="height:220px"><canvas id="ch-monthly"></canvas></div></div>`;
      if(mKeys.length){
        const ch=new Chart(document.getElementById('ch-monthly').getContext('2d'),{
          type:'bar',
          data:{labels:mKeys.map(k=>`${parseInt(k.split('-')[1])}月`),datasets:[{label:'銷售額',data:mKeys.map(k=>mm[k]),backgroundColor:'rgba(201,133,106,0.65)',borderRadius:6}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{font:{size:11}},grid:{color:'rgba(0,0,0,0.05)'}},x:{ticks:{font:{size:11}},grid:{display:false}}}}
        });
        activeCharts.push(ch);
      }
    } else if(tab==='hot'){
      const catMap={};const matMap={};
      rpSales.forEach(s=>{
        const p=rpProds.find(x=>x.id===s.product_id);
        if(p?.category){if(!catMap[p.category])catMap[p.category]={count:0,rev:0};catMap[p.category].count+=s.qty||1;catMap[p.category].rev+=Number(s.total);}
        if(p?.material)matMap[p.material]=(matMap[p.material]||0)+Number(s.total);
      });
      const cKeys=Object.entries(catMap).sort((a,b)=>b[1].count-a[1].count);
      const mKeys2=Object.entries(matMap).sort((a,b)=>b[1]-a[1]);
      c.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="card"><div class="card-title">🏆 類別熱銷</div><div style="height:200px"><canvas id="ch-cat"></canvas></div></div>
        <div class="card"><div class="card-title">💍 材質熱銷</div>
          ${mKeys2.length?mKeys2.map(([m,r],i)=>`<div class="flex jsb aic" style="padding:8px 0;border-bottom:1px solid var(--border2)"><span style="font-weight:800">#${i+1} ${m}</span><span style="font-weight:900;color:var(--accent)">${fmt(r)}</span></div>`).join(''):'<div style="text-align:center;padding:20px;color:var(--text3);font-weight:700">暫無資料</div>'}
        </div>
      </div>`;
      if(cKeys.length){
        const ch=new Chart(document.getElementById('ch-cat').getContext('2d'),{
          type:'doughnut',
          data:{labels:cKeys.map(x=>x[0]),datasets:[{data:cKeys.map(x=>x[1].count),backgroundColor:['#c9856a','#8b3a4a','#c8a050','#8070c8','#27ae60','#e67e22','#3498db'],borderWidth:2,borderColor:'rgba(255,255,255,0.8)'}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12}}}}
        });
        activeCharts.push(ch);
      }
    } else if(tab==='profit'&&isBoss){
      const mm2={};
      rpSales.forEach(s=>{
        const m=s.sold_at?.slice(0,7);
        if(m){if(!mm2[m])mm2[m]={r:0,c:0};mm2[m].r+=Number(s.total);mm2[m].c+=Number(s.cost||0)*Number(s.qty||1);}
      });
      const mK=Object.keys(mm2).sort();
      c.innerHTML=`
      <div class="stats">
        <div class="stat"><div class="stat-l">總銷售收入</div><div class="stat-v">${fmt(totalRev)}</div></div>
        <div class="stat"><div class="stat-l">銷售成本</div><div class="stat-v">${fmt(totalCost)}</div></div>
        <div class="stat"><div class="stat-l">總利潤</div><div class="stat-v" style="color:#16a34a">${fmt(totalProfit)}</div></div>
        <div class="stat"><div class="stat-l">平均毛利率</div><div class="stat-v">${totalRev>0?(totalProfit/totalRev*100).toFixed(1)+'%':'—'}</div></div>
        <div class="stat"><div class="stat-l">庫存成本值</div><div class="stat-v">${fmt(activeP.reduce((a,x)=>a+(Number(x.cost||0)*Number(x.stock||0)),0))}</div></div>
      </div>
      <div class="card"><div class="card-title">💰 月利潤走勢</div><div style="height:220px"><canvas id="ch-profit"></canvas></div></div>`;
      if(mK.length){
        const ch=new Chart(document.getElementById('ch-profit').getContext('2d'),{
          type:'line',
          data:{labels:mK.map(k=>`${parseInt(k.split('-')[1])}月`),datasets:[
            {label:'銷售額',data:mK.map(k=>mm2[k].r),borderColor:'#c9856a',tension:0.4,pointRadius:3,fill:false},
            {label:'利潤',data:mK.map(k=>mm2[k].r-mm2[k].c),borderColor:'#16a34a',tension:0.4,pointRadius:3,fill:true,backgroundColor:'rgba(22,163,74,0.08)'}
          ]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:12}}},scales:{y:{ticks:{font:{size:11}},grid:{color:'rgba(0,0,0,0.05)'}},x:{ticks:{font:{size:11}},grid:{display:false}}}}
        });
        activeCharts.push(ch);
      }
    } else if(tab==='settle'&&isBoss){
      const totalIn=rpSettle.filter(x=>x.type==='supplier_sold').reduce((a,x)=>a+Number(x.settlement_amount),0);
      const totalOut=rpSettle.filter(x=>x.type==='we_sold').reduce((a,x)=>a+Number(x.settlement_amount),0);
      c.innerHTML=`
      <div class="stats">
        <div class="stat"><div class="stat-l">廠商寄賣結算</div><div class="stat-v" style="color:var(--accent)">${fmt(totalIn)}</div></div>
        <div class="stat"><div class="stat-l">外借商品結算</div><div class="stat-v">${fmt(totalOut)}</div></div>
        <div class="stat"><div class="stat-l">結算總筆數</div><div class="stat-v">${rpSettle.length}</div></div>
      </div>
      <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table>
        <thead><tr><th>類型</th><th>廠商</th><th>商品</th><th>售出金額</th><th>結算金額</th><th>收款方式</th><th>日期</th></tr></thead>
        <tbody>${rpSettle.length===0
          ?'<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--text3);font-weight:700">暫無結算記錄</td></tr>'
          :rpSettle.map(x=>`<tr>
            <td><span class="badge" style="background:var(--accent-light);color:var(--text);font-size:10px">${x.type==='supplier_sold'?'廠商寄賣':'外借商品'}</span></td>
            <td style="font-weight:800">${x.supplier_name||'—'}</td>
            <td>${x.product_name||'—'}</td>
            <td>${fmt(x.sale_amount)}</td>
            <td style="font-weight:800;color:var(--accent)">${fmt(x.settlement_amount)}</td>
            <td style="font-size:12px">${x.payment_method||'—'}</td>
            <td style="font-size:12px">${fmtD(x.settled_at)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div></div>`;
    }
  };

  document.getElementById('rp-load').onclick=loadData;
  document.getElementById('rp-export').onclick=()=>{
    const nl='\n';
    const rows=[['銷售單號','日期','商品','貨號','客戶','數量','單價','折扣','總計','收款方式','銷售員'],
      ...rpSales.map(s=>[s.sale_no,fmtD(s.sold_at),s.product_name,s.product_sku||'',s.customer_name||'',s.qty,s.unit_price,s.discount,s.total,s.payment_method||'',s.sold_by||''])];
    const csv=rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,"'")+'"').join(',')).join(nl);
    const bom='\uFEFF';
    const a=document.createElement('a');
    a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(bom+csv);
    a.download='JUDY報表_'+new Date().toLocaleDateString('zh-TW')+'.csv';
    a.click();
  };
  loadData();
}

// ===== USERS =====
async function renderUsers(pc){
  const isBoss=currentUser.role==='boss';
  const isMgr=currentUser.role==='manager';
  const isStaff=currentUser.role==='staff';

  // 員工只看自己
  let query=sb.from('judy_users').select('id,username,display_name,role,password,created_at');
  if(isStaff) query=query.eq('id',currentUser.id);
  else if(isMgr) query=query.in('role',['manager','staff']); // 主管看主管+員工
  const{data:allUsers}=await query;

  // 排序：老闆→主管→員工，自己排第一
  const roleOrder={boss:0,manager:1,staff:2};
  const users=(allUsers||[]).sort((a,b)=>{
    if(a.id===currentUser.id) return -1;
    if(b.id===currentUser.id) return 1;
    return roleOrder[a.role]-roleOrder[b.role]||a.display_name.localeCompare(b.display_name);
  });

  pc.innerHTML=`
  <div class="flex aic jsb mb3">
    <div class="ptitle" style="margin:0">👥 帳號管理</div>
    ${!isStaff?'<button class="btn btn-p" id="add-user-btn">＋ 建立帳號</button>':''}
  </div>
  <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table>
    <thead><tr><th>帳號</th><th>顯示名稱</th><th>角色</th><th>密碼</th><th>操作</th></tr></thead>
    <tbody>${users.map(u=>{
      const isMe=u.id===currentUser.id;
      const roleLabel={boss:'⭐ 老闆',manager:'🔰 主管',staff:'💼 員工'}[u.role]||u.role;
      const roleColor={boss:'#c0392b',manager:'#c9856a',staff:'#888'}[u.role];
      // 密碼顯示邏輯
      let pwdDisplay='';
      let canEdit=false;
      if(isBoss){
        pwdDisplay=u.password; canEdit=true;
      } else if(isMgr){
        if(isMe){pwdDisplay=u.password;canEdit=true;}
        else if(u.role==='manager'){pwdDisplay='••••••';canEdit=false;}
        else if(u.role==='staff'){pwdDisplay=u.password;canEdit=true;}
      } else if(isStaff&&isMe){
        pwdDisplay=u.password;canEdit=true;
      }
      return`<tr style="${isMe?'background:var(--accent-light)':''}">
        <td><code style="font-size:12px;background:var(--accent-light);padding:2px 8px;border-radius:4px">${u.username}</code>
          ${isMe?'<span style="font-size:11px;color:var(--text3);margin-left:5px">（你）</span>':''}
        </td>
        <td style="font-weight:800">${u.display_name}</td>
        <td><span style="font-weight:800;color:${roleColor}">${roleLabel}</span></td>
        <td style="font-family:monospace;font-size:13px;color:var(--text2)">${pwdDisplay}</td>
        <td><div class="flex gap2">
          ${canEdit?`<button class="btn btn-s btn-xs" onclick="openUserModal('${u.id}')">✏️ 編輯</button>`:''}
          ${isBoss&&!isMe?`<button class="btn btn-d btn-xs" onclick="deleteUser('${u.id}')">🗑️</button>`:''}
        </div></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div></div>`;

  // 新增帳號
  document.getElementById('add-user-btn')?.addEventListener('click',()=>openUserModal(null));

  window.openUserModal=(id)=>{
    const u=id?users.find(x=>x.id===id):null;
    // 可建立的角色
    let roles=[];
    if(isBoss) roles=[{v:'boss',l:'⭐ 老闆'},{v:'manager',l:'🔰 主管'},{v:'staff',l:'💼 員工'}];
    else if(isMgr) roles=[{v:'manager',l:'🔰 主管'},{v:'staff',l:'💼 員工'}];
    // 主管不能編輯其他主管
    const canEditThis=isBoss||(isMgr&&(u?.role==='staff'||!u||u?.id===currentUser.id))||(isStaff&&u?.id===currentUser.id);
    if(!canEditThis&&id){flash('err','無權限編輯此帳號');return;}

    openModal(u?`編輯帳號 — ${u.display_name}`:'建立新帳號',`
    <div id="nu-a"></div>
    <div class="fg">
      <label class="fl">帳號${u?' <span style="color:var(--text3);font-weight:600;font-size:12px">（建立後不可修改）</span>':' *'}</label>
      <input class="fc" id="nu-user" value="${u?.username||''}" ${u?'readonly style="background:var(--accent-light);cursor:not-allowed"':''} placeholder="英文數字，建立後不可更改">
    </div>
    <div class="fg"><label class="fl">顯示名稱 *</label>
      <input class="fc" id="nu-name" value="${u?.display_name||''}" placeholder="員工姓名">
    </div>
    <div class="fg"><label class="fl">${u?'更改密碼':'密碼 *'}</label>
      <input class="fc" id="nu-pass" type="text" value="${u?.password||''}" placeholder="${u?'輸入新密碼':'設定密碼'}">
    </div>
    ${!u||isBoss?`<div class="fg"><label class="fl">角色</label>
      <select class="fc" id="nu-role">
        ${roles.map(r=>`<option value="${r.v}"${u?.role===r.v?' selected':''}>${r.l}</option>`).join('')}
      </select>
    </div>`:`<input type="hidden" id="nu-role" value="${u?.role||'staff'}">`}
    <div class="flex gap2" style="justify-content:flex-end;margin-top:4px">
      <button class="btn btn-s" onclick="closeModal()">取消</button>
      <button class="btn btn-p" id="nu-save">💾 ${u?'儲存變更':'建立帳號'}</button>
    </div>`);

    document.getElementById('nu-save').onclick=async()=>{
      const name=document.getElementById('nu-name').value.trim();
      const pass=document.getElementById('nu-pass').value.trim();
      const role=document.getElementById('nu-role').value;
      if(!name){showAlert('nu-a','err','請填寫顯示名稱');return;}
      if(!pass){showAlert('nu-a','err','請填寫密碼');return;}
      if(u){
        // 更新
        const updates={display_name:name,password:pass};
        if(isBoss) updates.role=role;
        const{error}=await sb.from('judy_users').update(updates).eq('id',u.id);
        if(error){showAlert('nu-a','err','更新失敗：'+error.message);return;}
        if(u.id===currentUser.id){currentUser.display_name=name;currentUser.password=pass;saveS(currentUser);}
        flash('ok','✅ 帳號已更新');closeModal();renderUsers(document.getElementById('pc'));
      } else {
        const uname=document.getElementById('nu-user').value.trim();
        if(!uname){showAlert('nu-a','err','請填寫帳號');return;}
        // 檢查帳號是否重複
        const{data:exist}=await sb.from('judy_users').select('id').eq('username',uname).maybeSingle();
        if(exist){showAlert('nu-a','err','此帳號已存在，請換一個');return;}
        if(!isBoss&&role==='boss'){showAlert('nu-a','err','無權限建立老闆帳號');return;}
        const{error}=await sb.from('judy_users').insert({username:uname,password:pass,display_name:name,role});
        if(error){showAlert('nu-a','err','建立失敗：'+error.message);return;}
        flash('ok','✅ 帳號已建立');closeModal();renderUsers(document.getElementById('pc'));
      }
    };
  };

  window.deleteUser=async(id)=>{
    if(!isBoss){flash('err','僅老闆可刪除帳號');return;}
    if(!confirm('確定要刪除此帳號？此操作無法復原。'))return;
    const{error}=await sb.from('judy_users').delete().eq('id',id);
    if(error){flash('err','刪除失敗：'+error.message);return;}
    flash('ok','帳號已刪除');renderUsers(document.getElementById('pc'));
  };
}


// ===== START =====
document.addEventListener('DOMContentLoaded',renderApp);
